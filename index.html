<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>전자공학개론 기출 문제은행</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">OFFLINE QUESTION BANK</p>
      <h1>전자공학개론 기출 문제은행</h1>
      <p class="header-copy">국가직·지방직·군무원 문제를 세부개념별로 골라 풀어보세요.</p>
    </div>
    <nav class="header-actions" aria-label="도구">
      <button class="button button-ghost" id="export-progress" type="button">기록 내보내기</button>
      <label class="button button-ghost file-label">기록 가져오기<input id="import-progress" type="file" accept="application/json"></label>
    </nav>
  </header>

  <main>
    <section class="dashboard" aria-label="문제은행 현황">
      <article><strong id="total-count">0</strong><span>전체 문제</span></article>
      <article><strong id="solved-count">0</strong><span>풀이 완료</span></article>
      <article><strong id="wrong-count">0</strong><span>오답</span></article>
    </section>

    <section class="setup-panel" id="setup-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">PRACTICE SETUP</p>
          <h2>풀 문제 고르기</h2>
        </div>
        <div class="filter-summary">
          <p id="filter-result" class="result-count">0문제</p>
          <button class="button button-secondary reset-filter" id="reset-filters" type="button">필터 초기화</button>
        </div>
      </div>

      <div class="filter-grid">
        <div class="filter-field">
          <span class="filter-label">시험구분 <small>복수선택 · OR</small></span>
          <div id="agency-filter" class="multi-topic-filter" role="group" aria-label="시험구분 복수선택"></div>
        </div>
        <div class="filter-field">
          <span class="filter-label">연도 <small>복수선택 · OR</small></span>
          <div id="year-filter" class="multi-topic-filter" role="group" aria-label="연도 복수선택"></div>
        </div>
        <div class="filter-field">
          <span class="filter-label">대분류 <small>복수선택 · OR</small></span>
          <div id="category-filter" class="multi-topic-filter" role="group" aria-label="대분류 복수선택"></div>
        </div>
        <div class="topic-filter-field">
          <span class="filter-label">중분류 <small>복수선택 · OR</small></span>
          <div id="topic-filter" class="multi-topic-filter" role="group" aria-label="중분류 복수선택"></div>
        </div>
        <div class="filter-field">
          <span class="filter-label">풀이 기록 <small>복수선택 · OR</small></span>
          <div id="history-filter" class="multi-topic-filter" role="group" aria-label="풀이 기록 복수선택"></div>
        </div>
      </div>

      <div class="mode-row">
        <fieldset>
          <legend>풀이 방식</legend>
          <label><input type="radio" name="mode" value="single" checked> 한 문제씩 풀기</label>
          <label><input type="radio" name="mode" value="batch"> 여러 문제 모아풀기</label>
        </fieldset>
        <label class="batch-size" id="batch-size-wrap">문제 수
          <select id="batch-size">
            <option value="2">2문제</option>
            <option value="3">3문제</option>
            <option value="4">4문제</option>
            <option value="5" selected>5문제</option>
            <option value="6">6문제</option>
            <option value="7">7문제</option>
            <option value="8">8문제</option>
            <option value="9">9문제</option>
            <option value="10">10문제</option>
          </select>
        </label>
        <label>출제 순서
          <select id="order-filter">
            <option value="random">무작위</option>
            <option value="chronological">연도·문제순</option>
          </select>
        </label>
        <button class="button button-primary start-button" id="start-practice" type="button">문제 풀기</button>
      </div>
    </section>

    <section class="practice-panel is-hidden" id="practice-panel" aria-live="polite">
      <div class="practice-toolbar">
        <button class="button button-secondary" id="back-to-setup" type="button">조건 다시 선택</button>
        <div class="toolbar-center">
          <strong id="practice-title">문제 풀이</strong>
          <span id="practice-progress"></span>
        </div>
        <button class="button button-ghost" id="toggle-all-meta" type="button">전체 분류 표시</button>
      </div>
      <div id="question-list" class="question-list"></div>
      <div class="batch-actions is-hidden" id="batch-actions">
        <p id="batch-answer-state">0 / 0문제 응답</p>
        <button class="button button-primary" id="grade-batch" type="button">일괄 채점</button>
      </div>
      <section class="result-panel is-hidden" id="result-panel"></section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
<!-- trigger GitHub Pages rebuild -->
